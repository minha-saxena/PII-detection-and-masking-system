version: '3.8'

services:
  # Ollama service for SLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: pii-masker-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - pii-masker-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI application
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pii-masker-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - rapidocr-models:/usr/local/lib/python3.11/site-packages/rapidocr/models
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=phi3.5
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - pii-masker-net
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  ollama-models:
    driver: local
  rapidocr-models:      
    driver: local

networks:
  pii-masker-net:
    driver: bridge